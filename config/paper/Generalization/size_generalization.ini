# Size generalization (many-to-many): the |V| = 10 model of the main results (3 gated layers, L = 6) and the
# |V| = 30 model (5 gated layers, L = 10), evaluated without retraining on the same 200 unseen 30-node networks.
# Add [Test ...] sections to evaluate more sizes (each with its own n, Tx/Rx, and channel file).
# Run: python scripts/SizeGeneralization.py <this file>
# Replace the 30-node checkpoint name (<...>) and the test file / Tx/Rx with your 30-node test set.

[Study]
mode: multiunicast
B: 6
sigma: 1
dropout: 0.2
noise conditioning: 1
z mode: candidate
reduce: fair
